<meta name="robots" content="noindex, nofollow" />

<link rel="manifest" id="manifestLink" href="data:application/manifest+json,%7B%22name%22%3A%22Angel%27s%20Office%22%2C%22short_name%22%3A%22Angel%27s%20Office%22%2C%22description%22%3A%22Angel's%20work%20app%20for%20Diyama%20Solutions%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23faf8f4%22%2C%22theme_color%22%3A%22%231f5c4d%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D'http%253A%252F%252Fwww.w3.org%252F2000%252Fsvg'%2520viewBox%253D'0%25200%2520100%2520100'%253E%253Crect%2520width%253D'100'%2520height%253D'100'%2520rx%253D'22'%2520fill%253D'%25231f5c4d'%252F%253E%253Ctext%2520x%253D'50'%2520y%253D'70'%2520font-size%253D'60'%2520text-anchor%253D'middle'%2520fill%253D'%2523fff'%2520font-family%253D'Georgia%252Cserif'%2520font-weight%253D'700'%253ED%253C%252Ftext%253E%253Ccircle%2520cx%253D'78'%2520cy%253D'66'%2520r%253D'8'%2520fill%253D'%2523e8a838'%252F%253E%253C%252Fsvg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D" />

<style>
  :root{
    --teal:#1f5c4d; --teal-dark:#16453a; --teal-soft:#e7f0ed;
    --gold:#e8a838; --gold-soft:#fbf1dd; --gold-text:#a9741a;
    --ink:#1e2b30; --muted:#6b7674; --surface:#faf8f4; --card:#ffffff; --input:#faf8f4;
    --border:#e8e4dc; --danger:#d64545; --danger-soft:#fbe9e9; --ok:#2e9e6b; --ok-soft:#e4f4ec;
    --header-bg:rgba(255,255,255,.78); --on-teal:#ffffff;
    --shadow:0 10px 30px -12px rgba(31,92,77,.15);
    --shadow-lg:0 18px 46px -16px rgba(31,92,77,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --teal:#5fb39d; --teal-dark:#7cc7b2; --teal-soft:#1d332d;
      --gold:#e8a838; --gold-soft:#3a2f17; --gold-text:#e8b865;
      --ink:#eceae4; --muted:#a2aba8; --surface:#10181a; --card:#182224; --input:#10181a;
      --border:#2a3a3c; --danger:#ef7b7b; --danger-soft:#3a1f1f; --ok:#4cc08a; --ok-soft:#1a3a2c;
      --header-bg:rgba(16,24,26,.8); --on-teal:#0e1a17;
      --shadow:0 10px 30px -12px rgba(0,0,0,.5); --shadow-lg:0 18px 46px -16px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --teal:#5fb39d; --teal-dark:#7cc7b2; --teal-soft:#1d332d;
    --gold:#e8a838; --gold-soft:#3a2f17; --gold-text:#e8b865;
    --ink:#eceae4; --muted:#a2aba8; --surface:#10181a; --card:#182224; --input:#10181a;
    --border:#2a3a3c; --danger:#ef7b7b; --danger-soft:#3a1f1f; --ok:#4cc08a; --ok-soft:#1a3a2c;
    --header-bg:rgba(16,24,26,.8); --on-teal:#0e1a17;
    --shadow:0 10px 30px -12px rgba(0,0,0,.5); --shadow-lg:0 18px 46px -16px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--ink); background:var(--surface); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    background-image:
      radial-gradient(720px 480px at 100% -10%, rgba(232,168,56,.10), transparent 60%),
      radial-gradient(760px 520px at 0% 108%, rgba(31,92,77,.10), transparent 60%);
    background-attachment:fixed;
  }
  h1,h2,h3,h4,.display{font-family:'Playfair Display',Georgia,serif}
  a{color:var(--teal)}
  button{font-family:inherit}
  p{margin:0 0 10px}

  /* Header */
  .header{position:sticky; top:0; z-index:50; background:var(--header-bg); backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--border)}
  .header-inner{max-width:960px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:56px}
  .wordmark{display:flex; align-items:center; gap:10px; text-decoration:none; min-width:0}
  .wordmark .brand{font-family:'Playfair Display'; font-weight:800; font-size:24px; color:var(--teal); letter-spacing:-.4px}
  .wordmark .brand .dot{color:var(--gold)}
  .wordmark .divider{width:1px; height:22px; background:var(--border)}
  .wordmark .app{font-size:14.5px; color:var(--muted); font-weight:600}
  .phase{font-size:12px; font-weight:700; padding:5px 10px; border-radius:20px; background:var(--teal-soft); color:var(--teal); white-space:nowrap}
  .phase.live{background:var(--gold-soft); color:var(--gold-text)}

  /* Navigation: top tabs on desktop, bottom bar on phones */
  .topnav{max-width:960px; margin:0 auto; padding:0 16px 10px; display:flex; gap:6px}
  .topnav button{border:1px solid var(--border); background:var(--card); color:var(--muted); border-radius:22px; padding:8px 16px; min-height:44px; font-size:14.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:7px}
  .topnav button svg{width:18px; height:18px}
  .topnav button.on{background:var(--teal); color:var(--on-teal); border-color:var(--teal)}
  .botnav{display:none}
  .navdot{display:inline-block; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--danger); color:#fff; font-size:11px; font-weight:700; line-height:18px; text-align:center}
  @media(max-width:720px){
    .topnav{display:none}
    .botnav{display:grid; grid-template-columns:repeat(5,1fr); position:fixed; left:0; right:0; bottom:0; z-index:60;
      background:var(--header-bg); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom)}
    .botnav button{position:relative; background:none; border:none; min-height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--muted); font-size:11.5px; font-weight:600; cursor:pointer; padding:6px 0}
    .botnav button svg{width:24px; height:24px}
    .botnav button.on{color:var(--teal)}
    .botnav button.on::before{content:""; position:absolute; top:0; left:28%; right:28%; height:3px; border-radius:0 0 3px 3px; background:var(--teal)}
    .botnav .navdot{position:absolute; top:6px; left:calc(50% + 6px)}
    body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  }

  /* Buttons */
  .btn{border:1px solid transparent; border-radius:12px; padding:10px 16px; min-height:44px; font-weight:600; font-size:15px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .18s ease, background .18s ease, border-color .18s ease; text-decoration:none; text-align:center; line-height:1.25}
  .btn-primary{background:var(--teal); color:var(--on-teal)}
  .btn-primary:hover{background:var(--teal-dark)}
  .btn-accent{background:var(--gold); color:#1e2b30}
  .btn-outline{background:var(--card); color:var(--teal); border-color:var(--border)}
  .btn-outline:hover{border-color:var(--teal); background:var(--teal-soft)}
  .btn-danger{background:transparent; color:var(--danger); border-color:var(--border)}
  .btn-danger:hover{background:var(--danger-soft)}
  .btn-sm{padding:8px 12px; font-size:14px}
  .btn-block{width:100%}
  .btn[disabled],.btn.off{opacity:.45; cursor:not-allowed; transform:none}
  .linkbtn{background:none; border:none; padding:10px 0; min-height:44px; color:var(--teal); text-decoration:underline; cursor:pointer; font-size:14px; font-weight:600}
  .linkbtn.danger{color:var(--danger)}

  /* Layout */
  .wrap{max-width:960px; margin:0 auto; padding:16px 16px 40px}
  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:18px; margin-bottom:16px}
  .card h2{font-size:22px; margin:0 0 6px; line-height:1.25}
  .card h3{font-size:18px; margin:0 0 6px; line-height:1.3}
  .eyebrow{font-size:11.5px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--gold-text); display:flex; align-items:center; gap:7px; margin-bottom:6px}
  .eyebrow::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--gold)}
  .muted{color:var(--muted)}
  .small{font-size:13.5px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}
  @media(max-width:560px){ .grid2,.grid3{grid-template-columns:1fr; gap:0} }
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .spread{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
  hr{border:none; border-top:1px solid var(--border); margin:14px 0}
  .pagehead{display:flex; justify-content:space-between; align-items:flex-end; gap:10px; flex-wrap:wrap; margin:4px 0 14px}
  .pagehead h1{font-size:28px; margin:0; line-height:1.15; color:var(--ink)}
  .pagehead p{margin:2px 0 0}

  /* Forms */
  label{display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:5px}
  input,textarea,select{width:100%; font-family:inherit; font-size:16px; color:var(--ink); background:var(--input);
    border:1px solid var(--border); border-radius:10px; padding:10px 12px; min-height:44px; outline:none}
  textarea{min-height:76px; resize:vertical}
  input:focus,textarea:focus,select:focus{border-color:var(--teal); box-shadow:0 0 0 3px rgba(31,92,77,.18)}
  input[type=checkbox],input[type=radio]{width:22px; height:22px; min-height:0; flex-shrink:0; accent-color:var(--teal)}
  .field{margin-bottom:12px}
  .hint{font-size:12.5px; color:var(--muted); margin-top:4px}
  .check{display:flex; gap:12px; align-items:flex-start; padding:11px 12px; min-height:44px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px; cursor:pointer; background:var(--card); font-size:15px; color:var(--ink); font-weight:500}
  .check.on{border-color:var(--ok); background:var(--ok-soft)}
  .check input{margin-top:1px}

  /* Banners */
  .banner{border-radius:12px; padding:12px 14px; font-size:14.5px; font-weight:600; margin-bottom:14px}
  .banner.warn{background:var(--gold-soft); color:var(--gold-text); border:1px solid var(--gold)}
  .banner.bad{background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger)}
  .banner.good{background:var(--ok-soft); color:var(--ok); border:1px solid var(--ok)}
  .math{background:var(--surface); border:1px dashed var(--border); border-radius:12px; padding:10px 12px; font-size:14px; font-variant-numeric:tabular-nums}

  /* Today */
  .todo{display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:var(--card); border:1px solid var(--border); border-left:5px solid var(--teal);
    border-radius:12px; padding:11px 14px; margin-bottom:8px; cursor:pointer; color:var(--ink); min-height:56px; font-size:15px}
  .todo:hover{border-color:var(--teal)}
  .todo.red{border-left-color:var(--danger); background:var(--danger-soft)}
  .todo.red b{color:var(--danger)}
  .todo.gold{border-left-color:var(--gold)}
  .todo.quiet{border-left-color:var(--border)}
  .todo.ok{border-left-color:var(--ok); background:var(--ok-soft); cursor:default}
  .todo span.tx{flex:1; min-width:0}
  .todo b{display:block; font-weight:700; line-height:1.3}
  .todo small{color:var(--muted); display:block; font-size:13px; margin-top:2px}
  .todo .arr{color:var(--muted); font-size:20px; flex-shrink:0}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:10px 0 12px}
  @media(max-width:440px){ .stats{grid-template-columns:repeat(2,1fr)} }
  .stat{background:var(--teal-soft); border-radius:12px; padding:10px 8px; text-align:center}
  .stat b{display:block; font-family:'Playfair Display'; font-size:26px; line-height:1.1; color:var(--teal)}
  .stat span{font-size:12px; color:var(--muted); font-weight:600}
  .tip{border-left:4px solid var(--gold); background:var(--gold-soft); padding:12px 14px; border-radius:0 12px 12px 0; margin:10px 0}
  .tip .why{font-size:11.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--gold-text); margin-bottom:4px}
  .tip p{margin:0; color:var(--ink)}
  .quick{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .welcome ul{margin:8px 0 12px; padding-left:20px}
  .welcome li{margin-bottom:6px}

  /* Chips */
  .chip{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:20px; letter-spacing:.2px; white-space:nowrap; background:var(--border); color:var(--muted)}
  .chip.s-out{background:var(--gold-soft); color:var(--gold-text)}
  .chip.s-warm{background:var(--teal-soft); color:var(--teal)}
  .chip.s-good{background:var(--ok-soft); color:var(--ok)}
  .chip.s-bad{background:var(--danger-soft); color:var(--danger)}
  .chip.nc{background:var(--gold-soft); color:var(--gold-text)}
  .chip.live{background:var(--danger-soft); color:var(--danger)}
  .fchips{display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; margin-bottom:6px; -webkit-overflow-scrolling:touch; scrollbar-width:thin}
  .fchip{flex:0 0 auto; border:1px solid var(--border); background:var(--card); color:var(--muted); border-radius:22px; padding:6px 13px; min-height:44px; font-size:13.5px; font-weight:600; cursor:pointer}
  .fchip.on{background:var(--teal); color:var(--on-teal); border-color:var(--teal)}

  /* Pipeline cards */
  .biz{background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:14px; margin-bottom:12px}
  .biz.flash{border-color:var(--gold); box-shadow:0 0 0 3px rgba(232,168,56,.35)}
  .biz-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .biz-name{font-family:'Playfair Display'; font-weight:700; font-size:18px; line-height:1.25; word-break:break-word}
  .biz-meta{font-size:13.5px; color:var(--muted); margin:2px 0 8px; word-break:break-word}
  .next{display:flex; gap:8px; align-items:center; font-size:14px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 10px; margin-bottom:10px}
  .next.due{border-color:var(--gold); background:var(--gold-soft)}
  .next.stop{border-color:var(--danger); background:var(--danger-soft); color:var(--danger); font-weight:600}
  .biz-acts{display:grid; grid-template-columns:1fr auto; gap:8px}
  .hist{margin:10px 0 0; padding:0; list-style:none; border-top:1px solid var(--border)}
  .hist li{padding:8px 0; border-bottom:1px solid var(--border); font-size:14px}
  .hist li small{color:var(--muted); display:block}
  .kv{font-size:14px; margin:8px 0}
  .kv div{margin-bottom:4px; word-break:break-word}
  .kv b{color:var(--muted); font-weight:600}
  .empty{text-align:center; padding:28px 16px}
  .empty p{color:var(--muted)}

  /* Activity picker */
  .actgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0}
  .actbtn{border:1px solid var(--border); background:var(--card); color:var(--ink); border-radius:12px; min-height:48px; padding:8px 10px; font-size:14.5px; font-weight:600; cursor:pointer; text-align:left}
  .actbtn.on{border-color:var(--teal); background:var(--teal-soft); color:var(--teal)}
  .actbtn[disabled]{opacity:.4; cursor:not-allowed}
  .preview{font-size:14px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin:8px 0}

  /* Meetings */
  .meet{background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:14px; margin-bottom:12px}
  .meet.alert{border-color:var(--danger)}
  .meet.flash{box-shadow:0 0 0 3px rgba(232,168,56,.35)}
  .when{font-weight:700; font-size:15px}
  .tl{display:flex; gap:4px; margin:12px 0}
  .tl .st{flex:1; min-width:0; text-align:center; font-size:11px; line-height:1.2; color:var(--muted)}
  .tl .st i{display:block; height:6px; border-radius:3px; background:var(--border); margin-bottom:5px}
  .tl .st.on{color:var(--ink); font-weight:700}
  .tl .st.on i{background:var(--ok)}
  .tl .st.bad i{background:var(--danger)}
  .mbtns{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px}
  @media(max-width:440px){ .mbtns{grid-template-columns:1fr} }
  .mbtns .btn{width:100%}
  .win{font-size:12px; color:var(--muted); display:block; font-weight:500}
  .outcome{border-top:1px solid var(--border); margin-top:12px; padding-top:12px}
  .seg{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:8px 0}

  /* Learn */
  .day{border:1px solid var(--border); border-radius:14px; margin-bottom:8px; background:var(--card); overflow:hidden}
  .day-head{display:flex; align-items:center; gap:10px; padding:10px 14px; min-height:56px; cursor:pointer; width:100%; background:none; border:none; text-align:left; color:var(--ink); font-size:15px}
  .day-num{flex-shrink:0; width:36px; height:36px; border-radius:50%; background:var(--teal-soft); color:var(--teal); font-weight:800; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display'}
  .day.done .day-num{background:var(--ok); color:#fff}
  .day.cur{border-color:var(--teal)}
  .day-title{flex:1; min-width:0; font-weight:700; line-height:1.3}
  .day-body{padding:0 14px 16px; border-top:1px solid var(--border)}
  .day-body h4{margin:14px 0 6px; font-size:16px; color:var(--teal)}
  .day-body ul{margin:0 0 10px; padding-left:20px}
  .day-body li{margin-bottom:4px}
  pre.paste{white-space:pre-wrap; word-wrap:break-word; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-family:inherit; font-size:13px; max-height:180px; overflow:auto; margin:8px 0}
  .taskbox{background:var(--gold-soft); border-radius:12px; padding:10px 12px; margin:10px 0}
  .taskbox b{color:var(--gold-text)}
  details.tipgrp{border:1px solid var(--border); border-radius:12px; margin-bottom:8px; background:var(--card)}

{ n:1, title:"What Diyama sells, and what my job is", kind:"nc",

"## What Diyama is",

  paste: function(){ return "You are my trainer for my 14 lessons. I go at my own pace, and I may finish faster than one lesson a day. My name is Angel Nawa. I am a 4th year civil engineering student at Copperbelt University, working from home in Lusaka. I am training to be an appointment setter for Diyama Solutions Ltd, a Zambian company led by its Managing Director, Ernest Moseni. Today is Lesson 1 of 14.\n\n" + TEACH + "\n\nWHAT DIYAMA IS\n\nA small Zambian company in Lusaka and Livingstone. Ernest is the Founder and Managing Director and the only person who takes meetings, agrees prices, signs anything or receives money. Diyama builds and runs the online side of small businesses: website or web app, Facebook and Instagram, Google listing, reviews. Tagline: Clarity in Action. Website: www.diyama.online.\n\nWHAT DIYAMA SELLS (public list prices, Kwacha)\n\nSocial media, monthly: One Platform K750 (Facebook OR Instagram, 8 posts). Two Platform K1,500 (Facebook and Instagram, 12 posts). Daily K2,200 (26 posts a month). Daily plus TikTok K3,200.\nWebsites, paid once: Landing page K1,000. Starter site K1,500. Business web app K2,500. Advanced web app K5,000.\nGoogle: Google Business Profile setup K1,000. Review engine K1,200.\nLodges: Direct Booking Sprint K3,500.\nDocuments: company profile from K3,600 for 7 pages. Tender document preparation K3,500.\nEvery build is sold with Site Care at K150 a month attached.\n\nRULES ABOUT MONEY: only Ernest agrees a price. I never quote a number that is not on this list, I never offer a discount, I never promise a date, I never agree anything for Diyama.\n\nMY TWO TERRITORIES\n\n1. Lusaka small businesses that are real and busy but weak online: restaurants, caterers, bakeries, clinics, guest houses, salons, gyms, fitness, spas, car dealers, hardware shops.\n2. My own construction and engineering network: contractors, quantity surveyors, hardware and building materials suppliers, consulting engineers. They live on tenders and almost none has a company profile, a website or a Google Business Profile.\n\nHOW I CONTACT PEOPLE (from Lesson 12 only)\n\nWhatsApp message first, then the business's Facebook page inbox, then a phone call once there is a reply. The meeting is usually a 20 minute WhatsApp video or Google Meet call where Ernest shares a demo link.\n\nMY JOB AND MY PAY\n\nMy job is to book Ernest verified meetings with named decision makers. I am paid K150 per verified meeting that Ernest actually attends, plus K300 when a meeting I booked becomes a paying client (first payment cleared), capped at 6 paid meetings a month for my first 90 days. Nothing is paid for leads found, messages sent or effort. Ernest confirms every meeting held and every client won.\n\nA meeting counts as booked only when all four are true: I know the name of the person who can say yes; that named person has agreed to meet; there is a day and a time; and there is a place, or a phone number and a time to call.\n\nTODAY'S LESSON\n\nTeach me these three things, one at a time, checking me as you go:\n1. What Diyama sells and what each thing costs. Quiz me, out of order, until I can say the main prices without looking.\n2. How to match a business to the right product. Give me five made up Zambian businesses one by one (include a contractor and a quantity surveyor) and ask me which product fits and why. Teach me to think: what is broken for this business, and which product fixes exactly that.\n3. What counts as a booked meeting. Give me four short examples, some real and some not, and make me judge each.\n\nThen make me say in one sentence what Diyama does, in my own words, as I would to a busy shop owner. Three tries, then pick the best with me.\n\nMY TASK FOR TODAY\n\nFive real businesses I pass or know in Lusaka, at least one from the construction network. For each: name and what it sells; Facebook page and when it last posted; website yes or no; on Google Maps yes or no; which Diyama product I would sell and its list price; one sentence on why. About ten minutes each, on my phone.\n\n" + NOCONTACT + " The talking starts on Lesson 12 and doing it early damages a real lead.\n\nWhen my list is done, make me read it back and challenge any match you think is wrong. Then I send it to Ernest."; }

  paste: function(){ return OPEN(3) + "TODAY'S LESSON: finding the name of the person who can say yes\n\nA business name is not a person. Teach me the difference between the owner or director (can say yes to money, my target), the manager (can say yes to small things, not the target) and the receptionist, waiter or guard (cannot say yes, but knows the owner's name and which number the owner answers; never pitch them, always be kind).\n\nThen teach me ways to find the owner's name without asking anyone: Facebook About section and who replies to comments; who replies to Google reviews; Instagram bio and WhatsApp Business profile; signboard, receipt, menu, business card; someone thanking the owner by name; booking sites naming a lodge host. For my construction and engineering network also teach me: tender award notices, company registration listings, LinkedIn, and people I already know.\n\nTeach me a few polite ways to ask when I must ask, and let me practise on you. Then give me a time limit per business and tell me what to do when there is no way to find the name.\n\nMY TASK FOR TODAY\n\nTake three of my kept businesses. For each write: the business; the name and role of the person who can say yes; exactly how I found it so Ernest can check; how sure I am from 1 to 5. If I cannot find a name I write what I tried and how long I spent. Making up a name or writing the manager is not an answer.\n\n" + NOCONTACT + " Send it to Ernest tonight."; }

"- Lesson 2: second message, a different angle, not the same message again",

"- After that, stop. Mark them cold in the tracker and try again in about three months.",
"## The rule that makes a follow up acceptable",
"Every follow up carries something new: a new fact about their business, a different question, a short example of what the fix looks like. Never just checking in, never did you see my message, never anything that makes them feel guilty.",
"## The last message",
"Short, warm, no complaint, and it makes it easy for them to come back months later without feeling awkward."
  ],
  task:"Pick one business and write the full sequence: first message, Day 2 follow up, Day 5 last message. Mark the day on each. Each must carry something new. Read them as the owner receiving all three and say honestly how the third makes me feel. Nothing is sent. Send to Ernest tonight.",
  paste: function(){ return OPEN(6) + "TODAY'S LESSON: the follow up\n\nTeach me why most replies come after the second or third message, and the sequence: Day 0 first message; Day 2 second message with a different angle; Day 5 last message, warm, door open; then stop, mark cold, try again in about three months.\n\nTeach me the rule that makes a follow up acceptable: every follow up carries something new (a new fact, a different question, a short example of the fix). Never just checking in, never did you see my message, never anything that makes them feel guilty.\n\nTeach me the last message especially: short, warm, no complaint, easy for them to come back months later.\n\nGive me three bad follow ups and make me say what is wrong with each.\n\nMY TASK FOR TODAY\n\nPick one business. Write the full sequence: first message, Day 2 follow up, Day 5 last message, with the day marked on each. Each must carry something new. Then I read them as the owner receiving them one after another and tell you honestly how the third makes me feel.\n\nNothing is sent. I send the sequence to Ernest tonight."; }
},
{ n:7, title:"Review, and the test", kind:"nc",
  lesson:[
"No new material today. Today my Claude tests me on everything from Lessons 1 to 6, hard and not kindly. It is better to find a weakness now than in front of a real owner.",
"## What I will be tested on",
"- The main prices, out of order",
"- Matching a business to a product",
"- The four tests, from memory",
"- Owner, manager and receptionist, and three ways to find a name",
"- The six line research note, in three minutes",
"- Hard proof versus soft proof",
"- A first message from scratch, under 90 words, ending in a question",
"- The follow up days and the one rule",
"- The four parts of a booked meeting",
"## What I am aiming at on Lesson 14",
"- 10 or more businesses contacted",
"- 3 or more replies",
"- 2 meetings booked with a named decision maker",
"- Tracker 100% correct",
"- Zero prices, discounts or promises that were not mine to give. One breach fails the gate on its own.",
"Also do the Quiz tab today. Today is also when Ernest decides whether I go live on Lesson 12."
  ],
  task:"Do the test with my Claude, record my score out of 45, my two strongest areas and my two weakest. Rewrite the worst piece of work from this week. Also do the Quiz tab. Send the score and my two weak points to Ernest tonight.",
  paste: function(){ return OPEN(7) + "Today there is nothing new. Today you test me. Test me hard, not kindly.\n\nGo through these one at a time. Do not tell me the answers first. Mark each out of 5 and keep a running total.\n1. Prices: ask me the main prices out of order, and what each thing is.\n2. Matching: four businesses (include a contractor and a hardware supplier), I pick the product and justify it.\n3. The four tests: I list them from memory, then apply them to a business you invent.\n4. The decision maker: owner, manager and receptionist, and three ways to find an owner's name.\n5. The research note: all six lines for a business you invent, in three minutes.\n6. Hard proof: five soft sentences, I turn each into a hard one.\n7. The first message: from scratch, under 90 words, ending in a question.\n8. The follow up: the days and the one rule that makes it acceptable.\n9. A booked meeting: the four things that must all be true, then three examples to judge.\n\nAt the end give me my total out of 45, my two strongest areas and the two things I would fail on if I went out tomorrow. Then help me rewrite the worst piece of work from this week.\n\nWHAT I AM AIMING AT AT LESSON 14: 10 or more businesses contacted; 3 or more replies; 2 meetings booked where all four things are true; every tracker row correct the same day; zero prices, discounts or promises that were not mine to give (one breach fails the gate on its own). Ask me which of the five worries me most and help me be honest.\n\nI send my score and two weak points to Ernest tonight."; }
},
{ n:8, title:"The four answers that come back", kind:"nc",
  lesson:[
"Almost every reply will be one of four things. If I have to invent an answer while the person waits, I will sound clumsy or promise something that is not mine. So I learn them now.",
"## 1. How much?",
"Prices are on the list and I may say them: for example a Starter site is K1,500 and social media starts at K750 a month. I never invent a number, offer a discount or price something not on the list. I give the list price, say our director confirms the exact fit, and move straight back to the meeting.",
"## 2. Send me a proposal, or send me your rates and I will get back to you",
"Sounds like yes, is usually a polite no. A proposal without seeing their business is a guess. I say so respectfully and offer 20 minutes with Ernest instead, so the proposal is about them. If they truly insist, I take it to Ernest.",
"## 3. We already have someone doing it",
"Never say anything bad about whoever they have. Ask what that person handles and listen for the gap: posts but no website, no Google listing, no company profile. An owner who already pays for this is a better lead.",
"## 4. No money right now",
"Find out if it is real or a soft no, without pushing. Ask when their busy season or next tender starts. Offer the smallest thing that still helps. If it is real, get a date to come back and write it down.",
"## The fifth answer is nothing at all",
"That is what Lesson 6 is for.",
"## One rule that covers all four",
"If I do not know, I say I do not know, I say I will ask Ernest, and I come back with the answer. Nobody ever lost a deal by saying that. People lose deals by guessing."
  ],
  task:"Write my own answer to each of the four replies, under 60 words each, in my own voice (not copied from my Claude). Then role play with my Claude as an impatient owner, with one rude reply, and get scored on each. Send my 4 answers to Ernest tonight.",
  paste: function(){ return OPEN(8) + "TODAY'S LESSON: what they say back, and what I say next\n\nAlmost every reply is one of four. Teach me each, then role play it with me as a difficult business owner.\n\n1. How much? Prices are on the list and I may say them (for example Starter site K1,500, social from K750 a month). I never invent a number, offer a discount or price something not on the list. I give the list price, say our director confirms the exact fit, and go back to the meeting.\n2. Send me a proposal. Usually a polite no. A proposal without seeing their business is a guess. I offer 20 minutes with Ernest instead. When they truly insist I take it to Ernest.\n3. We already have someone. Never criticise whoever they have. Ask what that person handles and listen for the gap. An owner who already pays is a better lead.\n4. No money right now. Find out if real or a soft no. Ask when their busy season or next tender starts, offer the smallest thing that helps, and if real get a date to come back.\n\nThen teach me the fifth and most common answer, nothing at all, and remind me what Lesson 6 said. Teach me the one rule for all four: if I do not know I say I will ask Ernest and come back.\n\nMY TASK FOR TODAY\n\nWrite my own answer to each of the four, in my own words, under 60 words each. Then role play with me as an impatient owner, use all four on me, make one of them rude, and score me on each.\n\nI send my four answers to Ernest tonight."; }
},
{ n:9, title:"Booking the meeting", kind:"nc",
  lesson:[
"A friendly conversation is not a meeting. This is exactly where most are lost. The person is warm, I write great, let me know when suits you, and nothing happens, because I handed them homework.",
"## What I do",
"- 1. Never ask when are you free. Offer two specific times: Thursday at 10:00 or Friday at 14:00.",
"- 2. Confirm all four things before I call it booked: the named person, their agreement, a day and a time, and a place or a phone number and a time to call.",
"- 3. Once the time is agreed, say who will be on the call: our Managing Director, Ernest Moseni. That is the first time I use his name.",
"- 4. Say how long: usually a 20 minute WhatsApp video or Google Meet call where Ernest shares a demo link. Small is easy to agree to.",
"- 5. Send a written confirmation the same day: day, date, time, and the link or number.",
"- 6. Reconfirm on the morning of the meeting. Short and friendly.",
"## Just come any time",
"That sounds helpful and is a way of not deciding. I turn it into a time: Thank you. So our director is not waiting, shall we say Thursday at 10:00 or Friday at 14:00?",
"## If they cancel",
"Do not sound hurt. Offer two new times in the same message.",
"## Whose diary",
"Ernest's, not mine. I ask him which days and times I may offer before I go live."
  ],
  task:"Role play 3 bookings with my Claude: one easy, one vague and slippery, one who cancels at the last minute. After each, write the confirmation message with all four things in it. Then say the four parts of a booked meeting again. Send the 3 confirmations to Ernest tonight and ask which days and times I may offer.",
  paste: function(){ return OPEN(9) + "TODAY'S LESSON: turning a friendly reply into a meeting in the diary\n\nTeach me these one at a time:\n1. Never ask when are you free. Offer two specific times.\n2. Confirm all four things before I call it booked: the named person, their agreement, a day and a time, and a place or a phone number and a time to call.\n3. Once the time is agreed, say who will be on the call: our Managing Director, Ernest Moseni. Never use his name before that point, and never say I work with him personally.\n4. Say how long: usually a 20 minute WhatsApp video or Google Meet call where Ernest shares a demo link. In person only when Ernest is already in Lusaka.\n5. Send a written confirmation the same day with day, date, time and link or number.\n6. Reconfirm on the morning of the meeting.\n\nTeach me what to do when they say just come any time, and what to do when they cancel (no hurt tone, two new times in the same message).\n\nMY TASK FOR TODAY\n\nRole play three bookings with me, back and forth: the first easy, the second vague and slippery, the third a person who cancels at the last minute. After each, help me write the confirmation message with all four things in it. Then ask me the four tests of a booked meeting once more.\n\nI send the three confirmations to Ernest tonight and ask him which days and times I am allowed to offer, because it is his diary."; }
},
{ n:10, title:"The tracker", kind:"nc",
  lesson:[
"Diyama keeps one tracker for the whole company. If it is not in the tracker, it did not happen. Money gets lost in the gap between a conversation and a record of it.",
"Ernest must be able to open one file and see exactly where every business stands without asking me a single question. If he has to ask, the tracker has failed.",
"## The discipline",
"- Log it the same day, in fact within the hour once I am live.",
"- One row per business. Never two rows for the same place.",
"- Never keep it only in my head, my notebook or scattered across WhatsApp.",
"- Facts in the notes, not opinions: what they said, not what I think they meant.",
"- If I promised to do something, the date goes in the next step column.",
"## The statuses",
"- Not contacted",
"- Contacted, no reply yet",
"- Replied, talking",
"- Meeting booked",
"- Not interested",
"- Cold, try again later",
"## The two columns that matter most",
"Next step must be an action with a date, never the words follow up on their own. Last updated: a row nobody touched in three weeks is a lead quietly dying.",
"## My own meeting log",
"The Meeting log tab in this app is my claim. Ernest confirms held and won. Origin for every row I source is Angel Nawa."
  ],
  task:"Ernest sends me the real column headings. Using them, write 5 practice rows for my 5 businesses, filling every column. Where I do not know something, I write what I would do to find out. Let my Claude check which rows Ernest would have to ask me about, and rewrite them. Send the 5 rows to Ernest tonight.",
  paste: function(){ return OPEN(10) + "TODAY'S LESSON: writing it down, in the one place\n\nDiyama keeps one tracker for the whole company. If it is not in the tracker it did not happen. Teach me why one shared tracker matters in a company this small: Ernest must be able to open one file and see where every business stands without asking me a question.\n\nTeach me the discipline: log it the same day (once live, within the hour); one row per business; never only in my head or WhatsApp; facts not opinions; if I promised something the date goes in the next step column; every row I source has my name in the Origin column.\n\nTeach me the statuses and make me judge which applies in six situations you invent: Not contacted; Contacted, no reply yet; Replied, talking; Meeting booked; Not interested; Cold, try again later.\n\nTeach me the two columns that matter most: Next step (an action with a date, never the word follow up alone) and Last updated.\n\nMY TASK FOR TODAY\n\nErnest is sending me the real column headings. Using them, I write five practice rows for the five businesses I have worked on, filling every column. Where I do not know something I write what I would need to do to find out. Then you tell me which rows Ernest would need to ask me about, and I rewrite them.\n\nI send the five rows to Ernest tonight."; }
},
{ n:11, title:"What I may never do", kind:"nc",
  lesson:[
"Tomorrow I speak to real businesses using Diyama's name. A sentence said quickly to a stranger can bind the whole company. If I tell an owner something while carrying the Diyama name, the owner is entitled to believe it, and Diyama may have to honour it even though nobody gave me permission. These limits protect Ernest and they protect me.",
"## The four hard limits",
"- 1. I never quote a price that is not on the list, and I never invent one.",
"- 2. I never offer a discount. Not a small one, not to be nice, not to save a deal.",
"- 3. I never promise a date: not when it will be finished, not when it will start.",
"- 4. I never agree anything on Diyama's behalf. Only Ernest agrees.",
"## And the rest",
"- I never take money from a client, not cash, not mobile money, not to pass on. All money goes to Ernest directly.",
"- I never tell one business what another pays.",
"- I never share a client's details anywhere public.",
"- I never call myself a manager or director. I am Angel from Diyama Solutions. I never say I work with Ernest personally.",
"- I never say we have done something we have not.",
"## The sentence I use when pushed",
"Our director agrees every price, so I will have him confirm that with you today.",
"## Before I go live",
"I confirm with Ernest that my agreement is signed. Nobody works without a signed document. I also ask him what I may say about when work could start."
  ],
  task:"Say the four hard limits from memory, then the rest. Let my Claude invent 5 pressure situations (one where the owner is very friendly) and say what I would actually say. Send my four limits in my own words to Ernest and ask what I may say about when work could start. Check my agreement is signed.",
  paste: function(){ return OPEN(11) + "TODAY'S LESSON: the limits, and why they exist\n\nTomorrow I speak to real businesses using Diyama's name. Teach me the reason first in simple words: if I tell an owner something while carrying the Diyama name, the owner is entitled to believe it and Diyama may have to honour it, even though nobody gave me permission.\n\nThe four hard limits:\n1. I never quote a price that is not on the list, and never invent one.\n2. I never offer a discount. Not small, not to be nice, not to save a deal.\n3. I never promise a date.\n4. I never agree anything on Diyama's behalf. Only Ernest agrees.\n\nAnd the rest: I never take money from a client (all money goes to Ernest directly); I never tell one business what another pays; I never share a client's details publicly; I never call myself a manager or director; I never say I work with Ernest personally, I am Angel from Diyama Solutions; I never say we have done something we have not; if unsure I say I will check with Ernest and come back.\n\nTeach me the calm sentence for when I am pushed, for example: Our director agrees every price, so I will have him confirm that with you today. Help me find my own version and practise it until it sounds natural.\n\nMY TASK FOR TODAY\n\nI say the four limits back from memory, then the rest. Then test me with five realistic pressure situations where the easy thing to say would break a rule, one of them a very friendly person (the harder one). I say what I would actually say and you tell me if I broke a rule.\n\nI send my four limits, in my own words, to Ernest tonight and ask him what I may say about when work could start."; }
},
{ n:12, title:"Live, with Ernest reading everything first", kind:"live",
  lesson:[
"Today is the first day I contact real businesses. Ernest gives me five. I draft, Ernest reads, Ernest says send, then I send. Nothing goes out before he has seen it. Not one message.",
"## How today runs, for each of the five",
"- 1. I write the six line research note (Lesson 4). My Claude attacks line 3 until the proof is hard.",
"- 2. I write the first message (Lesson 5): under 90 words, ends in a question, specific proof, no price unless asked, no promise, no date.",
"- 3. I send the message to Ernest, not to the business, and wait for his yes.",
"- 4. When he says send, I send it on WhatsApp (or the Facebook inbox if there is no WhatsApp) and log it in the tracker within the hour.",

"- Anything about price beyond the list, or a date, or anything unsure goes to Ernest first.",
"- If it turns friendly, go to Lesson 9 and book with two specific times Ernest allowed.",

"Most will not reply today. That is normal. Replies come after the second and third message.",
"## End of day",
"A report to Ernest, six lines at most: how many contacted; how many replied; any meeting booked with all four things; anything I could not answer; anything I worry I got wrong; what I do first tomorrow."

  task:"Contact Ernest's 5 businesses, each message approved by him first. Log each in the tracker within the hour and in my Meeting log if a meeting is booked. Add the count to the Gate tab. Send Ernest the six line report tonight.",
  paste: function(){ return OPEN(12).replace("Same chat as before.", "Same chat as before. Today is the first day I contact real businesses.") + "The rule for today: I draft, Ernest reads, Ernest says send, then I send. Nothing goes out before he has seen it. Not one message.\n\nBe my working partner today, not a teacher. Short answers. Help me draft, check my work against what I have learned, and keep me honest.\n\nHOW TODAY RUNS, for each of the five businesses Ernest has given me:\n1. I write the six line research note from Lesson 4. You attack line 3 until the proof is hard.\n2. I write the first message from Lesson 5. You check it: under 90 words, ends in a question, specific proof, no price unless asked, no promise, no date.\n3. I send the message to Ernest, not to the business, and wait for his yes.\n4. When he says send, I send it on WhatsApp (Facebook inbox if no WhatsApp) and log it in the tracker within the hour.\n\nIf a reply comes in: we work out which of the four answers from Lesson 8 it is; I write my reply and you check it against the four limits from Lesson 11; anything about price beyond the list, a date, or anything unsure goes to Ernest before I answer; if it turns friendly I go to Lesson 9 and book with two specific times Ernest allowed.\n\nMost will not reply today. That is normal. Remind me if I get discouraged.\n\nAT THE END OF TODAY help me write Ernest a report, six lines at most: how many contacted; how many replied; any meeting booked with all four things listed; anything I could not answer; anything I am worried I got wrong; what I do first tomorrow. Being honest in the last part is more useful to him than looking good."; }
},
{ n:13, title:"Live, on my own", kind:"live",

},

var TIPS = [
{c:["research"],t:"Look for one true fact you can show, not a feeling. A last post date, a missing Google Maps pin or a menu photo from last year is enough to start a conversation."},
{c:["research"],t:"Check the business in three places before you message: Facebook, Google Maps and WhatsApp Business. Ten minutes is plenty. If you are still digging after fifteen, write what you found and move on."},
{c:["research"],t:"Find the name of the person who can say yes before you write anything. Read who replies to Google reviews and who signs off Facebook comments. A message to a named owner gets read, a message to a business often does not."},
{c:["research"],t:"Drop weak leads early and without guilt. A branch with a head office elsewhere, or a business that looks closed, costs you the same hours as a good one and pays nothing."},
{c:["research"],t:"Take a screenshot of the problem when you find it. Pages change, and a screenshot lets Ernest see exactly what you saw when he prepares the demo."},

{c:["first"],t:"Start with what you noticed about their business, not with what Diyama sells. The owner cares about their shop, so the first line should be about their shop."},
{c:["first"],t:"Count the words before you press send. Under 90 words reads in a few seconds on a phone, and a short message looks like a person wrote it."},
{c:["first"],t:"End with one easy question that can be answered in a word, like: Would Thursday or Friday suit you? A message without a question gives them nothing to reply to."},
{c:["first"],t:"Send it in working hours, mid morning or early afternoon on a weekday. A business message late at night feels like an intrusion, even when the words are polite."},
{c:["first","booking"],t:"Introduce yourself as the company: I am Angel from Diyama Solutions. Never say you work with Ernest personally. Speaking as Diyama sounds established and professional."},

{c:["fbinbox"],t:"Page inboxes are often read by a staff member, not the owner. Ask politely for the owner's name and the best number to reach them, and thank whoever replies."},
{c:["fbinbox"],t:"Keep an inbox message even shorter than a WhatsApp one. One fact about their page, one line on what is possible, one question."},
{c:["fbinbox"],t:"Check when the page last answered a comment before you write. If nobody has replied to anyone for months, look for a WhatsApp number on the page or the Google listing instead."},
{c:["fbinbox"],t:"Never sell on their public wall or in the comments under their posts. Selling in public embarrasses the owner. The inbox is private, so keep it there."},

{c:["followup"],t:"Every follow-up carries something new: a fresh fact, a different question, or a short example of the fix. Never just checking in, and never did you see my message."},
{c:["followup"],t:"Space your follow-ups out the way the app schedules them. Two messages in one day feels like pressure, a few days apart feels like patience."},
{c:["followup"],t:"After three follow-ups with no reply, stop and park the business. Silence is an answer for now, and a parked lead can be tried again in about three months with a fresh angle."},
{c:["followup"],t:"Make the last follow-up warm and easy to come back to. Say it is your last message so you do not crowd their phone, and wish them a busy week."},
{c:["followup","home"],t:"A short voice note can work as a follow-up when text has been ignored. Keep it under 30 seconds, smile while you speak, and say your name and Diyama Solutions first."},

{c:["reply"],t:"Answer a reply within the hour if you can. A quick answer while they still have their phone in hand often turns a maybe into a meeting."},
{c:["reply"],t:"Read the reply twice and work out which of the four common answers it is. Then use the matching script from Scripts, in your own words."},
{c:["reply"],t:"Log the reply the moment it comes in. The app resets the touch count and sets the next action to Book the meeting, so nothing slips."},
{c:["reply"],t:"If the reply is friendly, move straight to two specific times: Thank you, would Thursday at 10:00 or Friday at 14:00 suit you for a 20 minute call?"},
{c:["reply"],t:"If a reply asks something you do not know, say you will check and come back today. Then ask Ernest and actually come back. A small promise kept builds trust for the big one."},

{c:["howmuch"],t:"You may say list prices, and only list prices. Give one or two examples, say our director confirms the exact fit, and go back to booking the call."},
{c:["howmuch"],t:"Do not apologise for a price or call it cheap. Say it plainly and move on. A price said calmly sounds fair."},
{c:["howmuch"],t:"Answer how much with the smallest relevant item on the list first. Starting from the entry point keeps the conversation easy to continue."},
{c:["howmuch"],t:"If they ask about something not on the list, say it is quoted after the call. Never guess a number, because a guessed number becomes the number they remember."},

{c:["proposal"],t:"Send me a proposal is often a polite no. Say kindly that a proposal written without seeing their business would only be a guess, and offer a 20 minute call so it can be about them."},
{c:["proposal"],t:"Offer the call with two specific times in the same message. A proposal request answered with an open question usually ends the conversation."},
{c:["proposal"],t:"If they truly insist on something in writing, do not write it yourself. Say you will ask our director, then pass the full details to Ernest the same day."},
{c:["proposal"],t:"Ask one question that helps whatever happens next: what would they most like it to fix? Their answer goes into the brief to Ernest."},

{c:["already"],t:"Never say anything bad about whoever they already have. Ask what that person handles today and listen for the gap: posts but no website, a website but no Google listing."},
{c:["already"],t:"An owner who already pays someone is a good lead, because they already believe this is worth money. Your job is to find what is missing, not to replace anyone."},
{c:["already"],t:"Say that our team often works alongside people who already help. It lowers their guard, and it is true."},
{c:["already"],t:"If they are happy and nothing is missing, thank them and park it with a note. A friendly exit today leaves the door open if their current person leaves."},

{c:["nomoney"],t:"Find out if it is a real no or a soft no, without pushing. Ask when their busy season or next tender starts."},

{c:["nomoney"],t:"Mention the smallest thing on the list that could still help, and stop there. Never offer a discount to make it fit. Only Ernest decides price."},
{c:["nomoney"],t:"Do not argue with a budget. Thank them for being honest and keep it short and warm, so they are glad to hear from you later."},

{c:["booking"],t:"Never ask when are you free. Offer two specific times from the slots Ernest gave you. A choice is easy, an open question is homework."},

{c:["booking","first"],t:"Speak as Diyama Solutions while you book: our team, our director. Only once the time is agreed do you say: our Managing Director, Ernest Moseni, will be on the call. That is the first time his name comes up."},

{c:["daybefore"],t:"Send Ernest the day-before reminder with the time, the channel, the link or number and the demo he needs. He should never have to search for anything."},

{c:["noshow"],t:"A no-show is common and it is not personal. Send one short message the same day offering two new times, with no complaint in it."},
{c:["noshow"],t:"Record the no-show honestly. A no-show pays nothing, and the log only works if it is true."},
{c:["noshow"],t:"Ask yourself which check was weakest when you booked it. Often the person who agreed could not say yes, or the time was vague."},
{c:["noshow"],t:"If they miss a second time, park the business and move on. Your hours are better spent on someone who keeps appointments."},

{c:["held"],t:"Record the outcome the same day. Tick Ernest attended only if he really did, because your pay depends on it and Ernest checks it."},
{c:["held"],t:"Ask Ernest one question after each call: what would have made it better? One answer a week makes your next booking stronger."},

/* Works out what logging activity k would do to business b, without changing it. */
function plan(b, k){

    if(b.stage === "Meeting booked" || b.stage === "Held" || closedStage(b.stage)) return p; /* recorded only */
    if(k === "call" && !p.replied) p.warn = "The rule is to call only once there is a reply. WhatsApp or the Facebook inbox first.";
    if(b.stage === "Parked" && b.parkedOn && daysBetween(b.parkedOn, t) < 60) p.warn = "Parked less than two months ago. The rule is to wait about three months before trying again.";
    if(!p.waiting || b.stage === "Parked"){
      p.waiting = true; p.fu = 0; p.anchor = t; p.stopped = false;
      if(!p.replied || b.stage === "Parked"){ p.stage = "Messaged"; p.replied = false; }
      p.next = fuLabel(1, p.replied); p.nextDate = addDays(t, CADENCE[0]);
    } else {
      p.fu += 1;
      if(!p.replied) p.stage = "Following up";

        p.next = fuLabel(p.fu + 1, p.replied); p.nextDate = due < soonest ? soonest : due;
      }

  }
  if(k === "research"){
    if(b.stage === "Researched" || !b.acts.length){ p.stage = "Researched"; p.next = "Send the first message"; p.nextDate = t; }
  } else if(k === "reply"){
    p.replied = true; p.waiting = false; p.fu = 0; p.anchor = ""; p.stopped = false;
    if(b.stage !== "Meeting booked" && b.stage !== "Held" && !closedStage(b.stage)){ p.stage = "Replied"; p.next = "Book the meeting"; p.nextDate = t; }
  } else if(k === "lost"){
    p.stage = "Lost"; p.next = ""; p.nextDate = ""; p.waiting = false; p.stopped = false;
  } else if(k === "park"){

/* K150 per held meeting Ernest attended. Within the first 90 days from the start date, at most 6 are paid per calendar month.
   K300 per client won is always paid. If no start date is set, the cap is applied (the careful estimate). */
function calc(){
  var startOk = !!(S.start && S.startSet);
  var held = S.meetings.filter(function(m){ return m.status === "held" && m.attended; })
    .sort(function(a, b){ return (a.date + a.time) < (b.date + b.time) ? -1 : 1; });
  var perMonth = {}, paid = {}, capped = {};
  held.forEach(function(m){
    var mon = (m.date || "").slice(0, 7);
    var inWin = !startOk || (daysBetween(S.start, m.date) + 1) <= CAP_DAYS;
    perMonth[mon] = (perMonth[mon] || 0) + 1;
    if(inWin && perMonth[mon] > CAP_MONTH) capped[m.id] = true; else paid[m.id] = true;
  });
  return { held:held, paid:paid, capped:capped, won:S.meetings.filter(function(m){ return m.won; }), startOk:startOk };
}
function moneyBetween(from, to){
  var c = calc(), nh = 0, nc = 0, nw = 0;
  c.held.forEach(function(m){ if(m.date >= from && m.date <= to){ if(c.paid[m.id]) nh++; else nc++; } });
  c.won.forEach(function(m){ var d = m.wonDate || m.date; if(d >= from && d <= to) nw++; });
  var total = nh * FEE_HELD + nw * FEE_WON;
  return { nh:nh, nw:nw, capped:nc, total:total,
    math: nh + " held x " + money(FEE_HELD) + " = " + money(nh * FEE_HELD) + "  +  " + nw + " won x " + money(FEE_WON) + " = " + money(nw * FEE_WON) + "  =  " + money(total) };
}

function ctxInfo(k){ for(var i = 0; i < TIP_CTX.length; i++) if(TIP_CTX[i][0] === k) return TIP_CTX[i]; return [k, k, ""]; }
function tipPool(ctx){ var p = []; TIPS.forEach(function(t, i){ if(t.c.indexOf(ctx) >= 0) p.push(i); }); return p; }
/* Rotates without repeating until every tip in the context has been seen, then starts again. */
function pickTip(ctx, exclude){
  var pool = tipPool(ctx); if(!pool.length) return -1;
  var seen = Array.isArray(S.tipsSeen[ctx]) ? S.tipsSeen[ctx] : [];
  var fresh = pool.filter(function(i){ return seen.indexOf(i) < 0 && i !== exclude; });
  if(!fresh.length){ seen = []; fresh = pool.filter(function(i){ return i !== exclude; }); if(!fresh.length) fresh = pool; }
  var pick = fresh[Math.floor(Math.random() * fresh.length)];
  seen.push(pick); S.tipsSeen[ctx] = seen; save();
  return pick;
}
function hash(s){ var h = 0; s = String(s); for(var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; } return Math.abs(h); }
function inlineTip(ctx, seed){

/* Chooses the context that best matches what is happening right now. */
function todayContext(){

  if(up[0] && untilMs(up[0]) <= 90 * 60000) return "hourbefore";

  var recent = S.meetings.filter(function(m){ return m.outcomeAt && (now - m.outcomeAt) < 3 * 24 * HOUR; }).sort(function(a, b){ return b.outcomeAt - a.outcomeAt; });
  if(recent[0]){ if(recent[0].won) return "won"; if(recent[0].status === "held") return "held"; if(recent[0].status === "noshow") return "noshow"; }
  var due = S.biz.filter(bizDue);

    '<div class="field"><label for="mf_prod">Likely product</label><select id="mf_prod">' + opts(PRODUCTS, p.product, "Not sure yet") + '</select></div>' +
    '<div class="fit" style="margin:4px 0 10px"><b>Schedule 4.</b> ' + esc(SCHEDULE4) + '</div>' +
    BOOK_CHECK.map(function(c, i){ return '<label class="check' + (checks[i] ? ' on' : '') + '"><input type="checkbox" id="mf_c' + i + '"' + (checks[i] ? ' checked' : '') + ' /><span>' + esc(c) + '</span></label>'; }).join("") +
    inlineTip("booking", "form" + (p.bizId || "")) +
    '<div class="sheet-foot"><div class="small" id="mf_missing" style="margin-bottom:8px; font-weight:600; color:var(--danger)"></div><button class="btn btn-primary btn-block" id="mf_save" data-act="savemeet" type="button">Save meeting</button></div>';
  return h;
}
function updateMeetSave(){
  var miss = [];
  for(var i = 0; i < 4; i++){ var c = $("mf_c" + i); if(c){ c.parentNode.classList.toggle("on", c.checked); if(!c.checked) miss.push(BOOK_CHECK_SHORT[i]); } }
  var btn = $("mf_save"), msg = $("mf_missing"); if(!btn) return;
  btn.disabled = miss.length > 0;
  msg.textContent = miss.length ? "Not booked yet. Missing: " + miss.join("; ") + "." : "";
}
function saveMeet(){
  updateMeetSave(); if($("mf_save").disabled) return;
  var bizId = val("mf_biz"), name = "", b = null;
  if(bizId && bizId !== "__new"){ b = findBiz(bizId); name = b ? b.name : ""; } else name = val("mf_new");
  var dm = val("mf_dm"), date = val("mf_date"), time = val("mf_time");
  if(!name){ toast("Choose or type the business"); return; }
  if(!dm){ toast("Write the decision maker's name"); return; }
  if(!date || !time){ toast("Set the date and the time"); return; }
  if(!b){
    b = { id:uid("b"), created:today(), name:name, type:"", territory:"Lusaka SME", dm:dm, role:val("mf_role"), channel:"WhatsApp", phone:val("mf_phone"), sells:"", broken:"",
      product:val("mf_prod"), origin:"Angel Nawa", notes:"Added from the Meetings form.", stage:"Replied", acts:[], fu:0, waiting:false, stopped:false, replied:true, anchor:"", next:"", nextDate:"" };
    S.biz.unshift(b);
  }
  var m = sheet.id ? findMeet(sheet.id) : null, isNew = !m;
  if(!m) m = newMeeting(sheet.pre || {});
  var moved = !isNew && (m.date !== date || m.time !== time);
  m.bizId = b.id; m.business = b.name; m.dm = dm; m.role = val("mf_role"); m.date = date; m.time = time;
  m.channel = val("mf_ch"); m.link = val("mf_link"); m.phone = val("mf_phone"); m.wants = val("mf_wants"); m.product = val("mf_prod");
  m.checks = [true,true,true,true];
  if(moved){ m.briefAt = ""; m.confirmed = false; m.reminderAt = ""; m.nudgeAt = ""; m.clientConfAt = ""; }
  if(isNew){
    S.meetings.push(m);
    if(m.rescheduleOf){ var old = findMeet(m.rescheduleOf); if(old){ old.status = "rescheduled"; old.outcomeAt = Date.now(); old.note = "Moved to " + fmtDate(date) + " at " + time + "."; } pushAct(b, "resched", "New time " + fmtDate(date) + " " + time); }
    else pushAct(b, "book", fmtDate(date) + " at " + time + ", " + m.channel);
  }
  if(!b.dm) b.dm = dm;
  b.stage = "Meeting booked"; b.next = "Meeting " + fmtDate(date) + " at " + time; b.nextDate = date; b.waiting = false; b.stopped = false; b.replied = true; b.fu = 0;
  save(); closeSheet(); ui.view = "meetings"; ui.flash = "m_" + m.id; render();
  toast(isNew || moved ? "Saved. Now send the brief to Ernest." : "Saved");
}

function setOutcome(m, status, note){
  var b = findBiz(m.bizId);
  m.status = status; m.outcomeAt = Date.now(); if(note) m.note = note;
  if(b){
    if(status === "held"){ b.stage = m.won ? "Won" : "Held"; b.next = "Ernest follows up with the client"; b.nextDate = ""; pushAct(b, "held", note); }
    else if(status === "noshow"){ b.stage = "Replied"; b.next = "Rebook: offer two new times"; b.nextDate = today(); pushAct(b, "noshow", note); }
  }
  ui.tip = null; save();
}
function exportMeetCsv(){
  var rows = [["Business","Decision maker","Role","Date","Time","Channel","Likely product","Status","Brief sent","Ernest confirmed","Ernest attended","Client won","Won date","Origin","Source"]];
  S.meetings.slice().sort(function(a, b){ return meetMs(a) - meetMs(b); }).forEach(function(m){
    rows.push([m.business, m.dm, m.role, m.date, m.time, m.channel, m.product, m.status, m.briefAt ? "yes" : "no", m.confirmed ? "yes" : "no", m.attended ? "yes" : "no", m.won ? "yes" : "no", m.wonDate, meetOrigin(m), "Angel's claim, Ernest confirms"]);
  });

}
function exportBizCsv(){
  var rows = [["Business","Type","Territory","Decision maker","Role","Channel","Phone","What they sell","What is weak online","Likely product","Stage","Follow-ups sent","Next action","Next date","Last activity","Created","Origin","Notes"]];
  S.biz.forEach(function(b){ rows.push([b.name, b.type, b.territory, b.dm, b.role, b.channel, b.phone, b.sells, b.broken, b.product, b.stage, b.fu || 0, b.next, b.nextDate, lastActDate(b), b.created, b.origin || "Angel Nawa", b.notes]); });

function weekForErnest(){
  var t = today(), end = addDays(t, 6);
  var list = S.meetings.filter(function(m){ return m.status === "booked" && m.date >= t && m.date <= end; }).sort(function(a, b){ return meetMs(a) - meetMs(b); });
  if(!list.length) return "Angel's meetings, " + fmtDate(t) + " to " + fmtDate(end) + ": none booked yet.";
  return "Angel's meetings, " + fmtDate(t) + " to " + fmtDate(end) + ":\n" + list.map(function(m){
    return "- " + fmtDate(m.date) + " " + m.time + ", " + m.business + ", " + m.dm + (m.role ? " (" + m.role + ")" : "") + ", " + m.channel + (m.product ? ", demo: " + m.product : "") + ". " + (m.confirmed ? "You confirmed." : "Not confirmed yet, please reply YES.");
  }).join("\n");
}

/* ================= THEME ================= */
function isDark(){ return S.theme === "dark" || (!S.theme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }
function applyTheme(){
  var r = document.documentElement;
  if(S.theme === "light" || S.theme === "dark") r.setAttribute("data-theme", S.theme); else r.removeAttribute("data-theme");
}
function toggleTheme(){ S.theme = isDark() ? "light" : "dark"; save(); applyTheme(); }

/* ================= INSTALL (Add to Home screen) ================= */
/* The head carries an inline manifest. When served over https this upgrades it with PNG icons drawn here
   and an absolute start address, which Chrome on Android needs to offer Add to Home screen. */
function iconPng(size){
  try{
    var c = document.createElement("canvas"); c.width = c.height = size; var x = c.getContext("2d"), s = size / 100;
    x.fillStyle = "#1f5c4d"; x.fillRect(0, 0, size, size);
    x.fillStyle = "#ffffff"; x.font = "bold " + Math.round(60 * s) + "px Georgia, serif"; x.textAlign = "center"; x.textBaseline = "alphabetic";
    x.fillText("D", 50 * s, 70 * s);
    x.fillStyle = "#e8a838"; x.beginPath(); x.arc(78 * s, 66 * s, 8 * s, 0, Math.PI * 2); x.fill();
    return c.toDataURL("image/png");
  }catch(e){ return ""; }
}
function setupInstall(){
  if(!/^https?:$/.test(location.protocol)) return;
  var p192 = iconPng(192), p512 = iconPng(512); if(!p192 || !p512) return;
  var base = location.href.split("#")[0].split("?")[0];
  var man = { name:"Angel's Office", short_name:"Angel's Office", description:"Angel's office at Diyama Solutions", start_url:base, scope:base.replace(/[^\/]*$/, ""),
    display:"standalone", orientation:"portrait", background_color:"#faf8f4", theme_color:"#1f5c4d",
    icons:[{src:p192, sizes:"192x192", type:"image/png", purpose:"any"}, {src:p512, sizes:"512x512", type:"image/png", purpose:"any"}, {src:p512, sizes:"512x512", type:"image/png", purpose:"maskable"}] };
  try{ $("manifestLink").setAttribute("href", "data:application/manifest+json," + encodeURIComponent(JSON.stringify(man))); }catch(e){}
  try{ $("appleIcon").setAttribute("href", iconPng(180)); }catch(e){}
}

/* ================= UPDATES =================
   Her data sits in this browser under KEY, which a new version never touches, so updating is just a reload.
   Coming back to the app picks up a new version straight away. While she is working, a bar offers it
   instead, so nothing she is typing is lost. A snapshot of her data is kept before every update. */
var VERSION = (document.querySelector('meta[name="app-version"]') || {}).content || "";
var pendingUpdate = "";
function checkUpdate(applyNow){
  if(!VERSION || !/^https?:$/.test(location.protocol) || !window.fetch) return;
  fetch(location.pathname + "?u=" + Date.now(), {cache:"no-store"}).then(function(r){ return r.ok ? r.text() : ""; }).then(function(txt){
    var m = /<meta name="app-version" content="([^"]+)"/.exec(txt || "");
    if(!m || m[1] === VERSION) return;
    pendingUpdate = m[1];
    var a = document.activeElement, busy = sheet || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName));
    if(applyNow && !busy) applyUpdate(); else showUpdateBar();
  }).catch(function(){});
}
function showUpdateBar(){
  if($("updbar")) return;
  var d = document.createElement("div"); d.id = "updbar"; d.className = "toast show"; d.style.pointerEvents = "auto";
  d.innerHTML = 'A new version of your office is ready. <button class="btn btn-primary btn-sm" data-act="applyupdate" type="button" style="margin-left:8px">Update now</button>';
  document.body.appendChild(d);
}
function applyUpdate(){
  save();
  try{ localStorage.setItem(SNAP_KEY, JSON.stringify({at:new Date().toISOString(), from:VERSION, to:pendingUpdate, data:S})); }catch(e){}
  location.reload();
}
/* Ask the browser not to clear her data when the phone runs low on space. */
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
document.addEventListener("visibilitychange", function(){ if(!document.hidden) checkUpdate(true); });
setInterval(function(){ if(!document.hidden) checkUpdate(false); }, 30 * 60000);

/* ================= START ================= */
load(); applyTheme(); render(); setupInstall();
/* Time windows (reminders, nudges, did it happen) change by the minute, so refresh quietly. */
setInterval(function(){
  if(sheet || document.hidden) return;
  var a = document.activeElement; if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  if(ui.view === "today" || ui.view === "meetings"){ var y = window.scrollY; render(); window.scrollTo(0, y); }
}, 60000);

})();
